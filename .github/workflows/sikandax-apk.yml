name: SikandX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "sikandax-android/**"
      - ".github/workflows/sikandax-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sikandax-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sikandax-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci || npm install
      - run: npx cap add android || true
      - run: npm run stamp-icons || true
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: android/gradlew -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SikandX-app-debug
          path: sikandax-android/android/app/build/outputs/apk/debug/app-debug.apk
