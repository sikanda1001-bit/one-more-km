{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<main class="narrow" style="padding:0;text-align:center">
<h1 style="font-size:56px">ADMIN 🔐</h1>
{% if error %}<p class="error-message">{{ error }}</p>{% endif %}
<form method="POST" action="/login" class="plan-form">
  <input type="text" name="username" placeholder="Username" required>
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">LOGIN</button>
  <p class="days-caption" style="text-align:center">Hint for demo: admin / 1234</p>
</form>
</main>
{% endblock %}
