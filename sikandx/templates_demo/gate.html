<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SikandX — Private Demo</title>
<style>
:root{--black:#0a0a0b;--panel:#131316;--line:#2a2417;--gold:#d4af37;--gold2:#f5d67b;--white:#f8f7f4;--muted:#a8a29e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 500px at 50% -10%,#2b230f 0%,var(--black) 55%);color:var(--white);font-family:Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;max-width:420px;width:92%}
.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#8a6d1c);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:26px;margin-bottom:12px}
h1{margin:0;letter-spacing:3px}h1 span{color:var(--gold2)}
p{color:var(--muted);font-size:14px}
input{background:#000;border:1px solid #3a3220;color:var(--white);border-radius:10px;padding:12px;width:100%;margin:8px 0}
button{background:linear-gradient(135deg,var(--gold2),var(--gold));border:0;color:#000;font-weight:900;border-radius:10px;padding:12px;width:100%;cursor:pointer;margin-top:6px}
.err{color:#f87171;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<div class="logo">SX</div>
<h1>SIKAND<span>X</span></h1>
<p>Private shared demo. Enter the access code you were given.</p>
<form method="post" action="/unlock">
<input name="code" type="password" placeholder="Access code" autocomplete="off">
<button type="submit">ENTER DEMO</button>
</form>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
</div>
</body>
</html>
